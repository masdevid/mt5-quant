# cargo-deny configuration — https://embarkstud.io.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  # via option-ext ← dirs-sys ← dirs
  "MPL-2.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "warn"
